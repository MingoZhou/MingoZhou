# （可选）生成 3D 贡献图，提交到 main 分支的 profile-3d-contrib/ 目录
# 效果：https://raw.githubusercontent.com/MingoZhou/MingoZhou/main/profile-3d-contrib/profile-south-season-animate.svg
name: GitHub-Profile-3D-Contrib

on:
  # 每天 UTC 18:00（北京时间次日 02:00）自动更新
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "generated 3D contribution graph" || exit 0
          git push
