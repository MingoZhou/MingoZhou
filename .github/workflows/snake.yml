# 生成「贡献度贪吃蛇」动画，输出到 output 分支
# 效果：https://raw.githubusercontent.com/MingoZhou/MingoZhou/output/github-contribution-grid-snake.svg
name: generate-snake-animation

on:
  # 每 24 小时自动更新一次
  schedule:
    - cron: "0 0 * * *"
  # 也可以在 Actions 页面手动触发
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: generate snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: MingoZhou
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#7C3AED
            dist/github-contribution-grid-snake-dark.svg?color_snake=#06B6D4&palette=github-dark
      - name: push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
